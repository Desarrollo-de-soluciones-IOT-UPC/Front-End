# CI del frontend: compila la SPA de Angular.
# El despliegue NO va aquí: la VM de Oracle construye la imagen por SSH
# (ver Back-End/deploy/README.md). El workflow *.disabled es el antiguo de
# Azure App Service, conservado como referencia histórica.

name: CI — Front-End

# En cualquier rama: un gate que solo mira main avisa cuando ya es tarde.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # `ng build` no solo transpila: la compilación AOT valida las PLANTILLAS
      # contra los miembros de cada componente. En la fase 10 fue lo que cazó
      # que los campos de las facades chocaban con signals ya existentes.
      - name: Compilar (producción)
        run: npm run build

      - name: Verificar que la imagen Docker se construye
        run: docker build -t emsafe-web:ci .

<div class="sidebar">
  <div class="sidebar__top">
    <div class="logo-section">
      <div class="logo-box" aria-hidden="true">E</div>

      <div class="brand">
        <h2>EmSafe</h2>
        <p>Admin Portal</p>
        <span class="tag">Vigilance &amp; Control</span>
      </div>
    </div>

    <nav class="nav-links" aria-label="Admin navigation">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="ph ph-layout-grid" aria-hidden="true"></i>
        <span>Dashboard</span>
      </a>

      <a routerLink="/work-orders" routerLinkActive="active">
        <i class="ph ph-clipboard-text" aria-hidden="true"></i>
        <span>Work Orders</span>
      </a>

      <a routerLink="/history" routerLinkActive="active">
        <i class="ph ph-clock-counter-clockwise" aria-hidden="true"></i>
        <span>History</span>
      </a>

      <a routerLink="/users" routerLinkActive="active">
        <i class="ph ph-users" aria-hidden="true"></i>
        <span>Users</span>
      </a>
    </nav>
  </div>

  <div class="sidebar__bottom">
    <a class="bottom-link" href="#" (click)="$event.preventDefault()">
      <i class="ph ph-headset" aria-hidden="true"></i>
      <span>Support</span>
    </a>

    <a class="bottom-link bottom-link--danger" href="#" (click)="$event.preventDefault()">
      <i class="ph ph-sign-out" aria-hidden="true"></i>
      <span>Logout</span>
    </a>
  </div>
</div>

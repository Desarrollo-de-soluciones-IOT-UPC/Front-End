<div class="topbar">
  <div class="topbar__brand">
    <span class="brand-name">{{ 'topbar_brand' | t }}</span>
  </div>

  <div class="topbar__right">
    <button class="lang-toggle" type="button" (click)="lang.toggle()" [title]="lang.lang() === 'en' ? 'Switch to Spanish' : 'Cambiar a inglés'">
      <i class="ph ph-translate" aria-hidden="true"></i>
      <span>{{ lang.lang() === 'en' ? 'ES' : 'EN' }}</span>
    </button>

    <div class="icon-actions" aria-label="Quick actions">
      <button class="icon-btn" type="button" aria-label="Notifications">
        <i class="ph ph-bell" aria-hidden="true"></i>
      </button>

      <button class="icon-btn" type="button" aria-label="Settings">
        <i class="ph ph-gear" aria-hidden="true"></i>
      </button>
    </div>

    <div class="profile">
      <div class="profile__meta">
        <h3>{{ auth.currentUser()?.name ?? 'User' }}</h3>
        <span>{{ auth.currentUser()?.role === 'admin' ? ('topbar_role' | t) : ('topbar_role_tech' | t) }}</span>
      </div>
      <div class="avatar" aria-hidden="true">{{ auth.currentUser()?.initials ?? '?' }}</div>
    </div>
  </div>
</div>

<div class="tech-layout" [class.sidebar-open]="layout.sidebarOpen()">
  <aside class="sidebar-wrap">
    <app-tech-sidebar />
  </aside>

  <div class="sidebar-overlay" (click)="layout.close()" aria-hidden="true"></div>

  <div class="main-content" role="main">
    <header class="topbar-wrap">
      <app-topbar />
    </header>

    <div class="page-content">
      <div class="page-inner">
        <router-outlet />
      </div>
    </div>
  </div>
</div>
<app-toast></app-toast>

<div class="login-page">
  <div class="login-card">
    <div class="login-card__logo">
      <div class="logo-icon">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="20" fill="#f0f4ff"/>
          <path d="M20 8 L20 20 M20 20 L20 32 M8 20 L20 20 M20 20 L32 20
                   M11.5 11.5 L20 20 M20 20 L28.5 28.5
                   M28.5 11.5 L20 20 M20 20 L11.5 28.5"
                stroke="#1a6eff" stroke-width="2" stroke-linecap="round"/>
          <circle cx="20" cy="20" r="3.5" fill="#1a6eff"/>
          <circle cx="20" cy="8"  r="2" fill="#1a6eff"/>
          <circle cx="20" cy="32" r="2" fill="#1a6eff"/>
          <circle cx="8"  cy="20" r="2" fill="#1a6eff"/>
          <circle cx="32" cy="20" r="2" fill="#1a6eff"/>
          <circle cx="11.5" cy="11.5" r="1.5" fill="#1a6eff" opacity="0.6"/>
          <circle cx="28.5" cy="28.5" r="1.5" fill="#1a6eff" opacity="0.6"/>
          <circle cx="28.5" cy="11.5" r="1.5" fill="#1a6eff" opacity="0.6"/>
          <circle cx="11.5" cy="28.5" r="1.5" fill="#1a6eff" opacity="0.6"/>
        </svg>
      </div>
      <h1 class="logo-name">EmSafe</h1>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">{{ 'login_email' | t }}</label>
        <div class="input-wrap">
          <i class="ph ph-envelope" aria-hidden="true"></i>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            [placeholder]="'login_emailPlaceholder' | t"
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="password">{{ 'login_password' | t }}</label>
          <a href="#" class="forgot-link" (click)="$event.preventDefault()">{{ 'login_forgotPassword' | t }}</a>
        </div>
        <div class="input-wrap">
          <i class="ph ph-lock" aria-hidden="true"></i>
          <input
            id="password"
            [type]="showPass() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button type="button" class="eye-btn" (click)="togglePass()" [attr.aria-label]="showPass() ? 'Hide password' : 'Show password'">
            <i [class]="showPass() ? 'ph ph-eye-slash' : 'ph ph-eye'" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="remember-row">
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="remember" name="remember" />
          <span>{{ 'login_remember' | t }}</span>
        </label>
      </div>

      @if (errorMsg()) {
        <p class="error-msg" role="alert">
          <i class="ph ph-warning-circle" aria-hidden="true"></i>
          {{ errorMsg() }}
        </p>
      }

      <button type="submit" class="btn-signin" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
        }
        {{ 'login_signIn' | t }}
      </button>

      <div class="divider">
        <span>{{ 'login_or' | t }}</span>
      </div>

      <button type="button" class="btn-google" (click)="$event.preventDefault()">
        <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        {{ 'login_google' | t }}
      </button>
    </form>
  </div>

  <footer class="login-footer">
    <p>{{ 'login_footer' | t }}</p>
    <nav>
      <a href="#" (click)="$event.preventDefault()">Terms</a>
      <a href="#" (click)="$event.preventDefault()">Privacy</a>
      <a href="#" (click)="$event.preventDefault()">Security</a>
    </nav>
  </footer>
</div>
